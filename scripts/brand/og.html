<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&family=Inter:wght@500;700&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 0 96px;
        box-sizing: border-box;
        background: #f6f7f9;
        color: #1b2130;
        font-family: Inter, sans-serif;
      }
      img {
        width: 340px;
        height: 340px;
        flex: none;
        border-radius: 50%;
        box-shadow:
          0 0 0 10px #f6f7f9,
          0 0 0 16px #3b497a;
      }
      h1 {
        margin: 0;
        font-size: 76px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      .role {
        margin: 20px 0 0;
        font-size: 36px;
        font-weight: 500;
        color: #3b497a;
      }
      .site {
        margin: 40px 0 0;
        font-family: "Fira Code", monospace;
        font-size: 30px;
        font-weight: 500;
        color: #5a6273;
      }
      .site span {
        color: #3b497a;
      }
    </style>
  </head>
  <body>
    <img src="../../src/assets/headshot.jpg" alt="" />
    <div>
      <h1>Carson Price</h1>
      <p class="role">ML Platform &amp; AI Engineer</p>
      <p class="site">cdprice<span>.dev</span></p>
    </div>
  </body>
</html>
